plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}

dependencies {
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.20.1"
    implementation "net.fabricmc.fabric-api:fabric-api:0.165.0+26.3"
    implementation project(':common')
    implementation 'mc-bridge:common'
    implementation 'mc-bridge:fabric-26.3'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from(project(':common').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.findAll { it.absolutePath.contains("mc-bridge") }.collect { zipTree(it) }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
