pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mace-cooldown-mod'

includeBuild '../mc-bridge'

include 'common', 'fabric-1.21', 'fabric-26.x', 'fabric-26.2', 'fabric-26.3', 'neoforge-1.21', 'neoforge-26.x'
