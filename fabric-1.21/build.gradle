plugins {
    id 'net.fabricmc.fabric-loom-remap'
    id 'maven-publish'
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.5:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"
    implementation project(':common')
    implementation 'mc-bridge:common'
    implementation 'mc-bridge:fabric-1.21'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

jar {
    from(project(':common').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.findAll { it.absolutePath.contains("mc-bridge") }.collect { zipTree(it) }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
